# Production deploy variant: assumes managed Postgres + Redis (e.g. Neon,
# Supabase, Upstash, or a provider's managed add-ons) rather than running
# stateful services in containers on the same host. Use with:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires a real .env with production DATABASE_URL / REDIS_URL pointing at
# your managed instances, COOKIE_SECURE=true, and a strong JWT_SECRET.
name: syncrank-prod

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api
